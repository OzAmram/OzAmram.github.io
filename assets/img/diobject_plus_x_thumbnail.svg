<rect x="160" y="572" width="360" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="594" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#3C3489">anomaly classifier</text>
<text x="340" y="618" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="400" fill="#534AB7">trained on X, not the resonance</text>
</svg>
